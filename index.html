<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajude Agora</title>
    <!-- Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 sm:p-8 text-center">
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-2">Faça a sua Contribuição</h1>
        <p class="text-gray-600 mb-6 text-sm sm:text-base">Escolha uma das opções abaixo para realizar o seu apoio.</p>

        <!-- Botão Principal Ajude Agora -->
        <button onclick="toggleOpcoes()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-6 rounded-xl shadow-lg transition duration-300 transform active:scale-95 flex items-center justify-center gap-2 cursor-pointer">
            <i class="fa-solid fa-heart"></i> Ajude Agora
        </button>

        <!-- Seção de Campos de Pagamento (Inicialmente Oculta) -->
        <div id="secao-pagamento" class="hidden mt-6 space-y-4 text-left transition-all duration-300">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider text-center mb-2">Selecione o método de pagamento</p>

            <!-- M-Pesa -->
            <div class="border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                <button onclick="toggleDetalhes('mpesa')" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 flex justify-between items-center transition cursor-pointer">
                    <span>M-Pesa</span>
                    <i id="icon-mpesa" class="fa-solid fa-chevron-down transition-transform"></i>
                </button>
                <div id="detalhes-mpesa" class="hidden bg-gray-50 p-4 border-t border-gray-100">
                    <div class="text-sm text-gray-700 mb-2">
                        <span class="font-semibold">Titular:</span> Adelia<br>
                        <span class="font-semibold">Número:</span> <span id="num-mpesa" class="font-mono font-bold text-gray-900">853778023</span>
                    </div>
                    <button onclick="copiarTexto('853778023', this)" class="w-full bg-gray-800 hover:bg-gray-900 text-white text-sm font-medium py-2 px-3 rounded-lg flex items-center justify-center gap-2 transition cursor-pointer">
                        <i class="fa-regular fa-copy"></i> Copiar Número
                    </button>
                </div>
            </div>

            <!-- e-Mola -->
            <div class="border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                <button onclick="toggleDetalhes('emola')" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-4 flex justify-between items-center transition cursor-pointer">
                    <span>e-Mola</span>
                    <i id="icon-emola" class="fa-solid fa-chevron-down transition-transform"></i>
                </button>
                <div id="detalhes-emola" class="hidden bg-gray-50 p-4 border-t border-gray-100">
                    <div class="text-sm text-gray-700 mb-2">
                        <span class="font-semibold">Titular:</span> Adelia<br>
                        <span class="font-semibold">Número:</span> <span id="num-emola" class="font-mono font-bold text-gray-900">867508496</span>
                    </div>
                    <button onclick="copiarTexto('867508496', this)" class="w-full bg-gray-800 hover:bg-gray-900 text-white text-sm font-medium py-2 px-3 rounded-lg flex items-center justify-center gap-2 transition cursor-pointer">
                        <i class="fa-regular fa-copy"></i> Copiar Número
                    </button>
                </div>
            </div>

            <!-- BIM -->
            <div class="border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                <button onclick="toggleDetalhes('bim')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 flex justify-between items-center transition cursor-pointer">
                    <span>BIM</span>
                    <i id="icon-bim" class="fa-solid fa-chevron-down transition-transform"></i>
                </button>
                <div id="detalhes-bim" class="hidden bg-gray-50 p-4 border-t border-gray-100">
                    <div class="text-sm text-gray-700 mb-2">
                        <span class="font-semibold">NIB / Conta:</span> <span id="num-bim" class="font-mono font-bold text-gray-900 text-xs sm:text-sm break-all">000100000111982222457</span>
                    </div>
                    <button onclick="copiarTexto('000100000111982222457', this)" class="w-full bg-gray-800 hover:bg-gray-900 text-white text-sm font-medium py-2 px-3 rounded-lg flex items-center justify-center gap-2 transition cursor-pointer">
                        <i class="fa-regular fa-copy"></i> Copiar Conta
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Script JavaScript para interatividade -->
    <script>
        function toggleOpcoes() {
            const secao = document.getElementById('secao-pagamento');
            secao.classList.toggle('hidden');
        }

        function toggleDetalhes(metodo) {
            const detalhes = document.getElementById(`detalhes-${metodo}`);
            const icon = document.getElementById(`icon-${metodo}`);
            
            // Alterna visibilidade
            detalhes.classList.toggle('hidden');
            
            // Gira o ícone da seta
            icon.classList.toggle('rotate-180');
        }

        function copiarTexto(texto, botao) {
            navigator.clipboard.writeText(texto).then(() => {
                const originalHTML = botao.innerHTML;
                botao.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i> Copiado!';
                botao.classList.add('bg-emerald-700');
                
                setTimeout(() => {
                    botao.innerHTML = originalHTML;
                    botao.classList.remove('bg-emerald-700');
                }, 2000);
            }).catch(err => {
                console.error('Erro ao copiar: ', err);
            });
        }
    </script>
</body>
</html>
