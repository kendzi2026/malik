    <style>
        :root {
            --red: #ef3b3b;
            --red-dark: #d12a2e;
            --green: #18a957;
            --green-dark: #0f8a43;
            --green-glow: rgba(24, 169, 87, .45);
            --navy: #0f2747;
            --ink: #1d2b3f;
            --muted: #5b6778;
            --bg: #fffdfa;
            --bg-alt: #f7f3ee;
            --card: #ffffff;
            --line: #eadfd5;
            --blush: #fdecec;
            --dark: #14161a;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --navy: #f2f5fa;
                --ink: #e4e9f1;
                --muted: #a3aebf;
                --bg: #15181d;
                --bg-alt: #1b1f26;
                --card: #222731;
                --line: #303744;
                --blush: #2a2024;
            }
        }

        :root[data-theme="dark"] {
            --navy: #f2f5fa;
            --ink: #e4e9f1;
            --muted: #a3aebf;
            --bg: #15181d;
            --bg-alt: #1b1f26;
            --card: #222731;
            --line: #303744;
            --blush: #2a2024;
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
            scroll-behavior: smooth
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden
        }

        img {
            max-width: 100%;
            display: block
        }

        a {
            color: inherit;
            text-decoration: none
        }

        .wrap {
            max-width: 1080px;
            margin: 0 auto;
            padding: 0 28px
        }

        :focus-visible {
            outline: 3px solid #ffd54a;
            outline-offset: 3px
        }

        svg {
            flex: none
        }

        /* ---------- CTA verde ---------- */

        .cta {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 14px;
            background: linear-gradient(180deg, #22c068, var(--green) 55%, var(--green-dark));
            color: #fff;
            font-weight: 800;
            font-size: 21px;
            letter-spacing: .03em;
            text-transform: uppercase;
            padding: 20px 22px 20px 30px;
            border-radius: 999px;
            border: 0;
            cursor: pointer;
            box-shadow: 0 12px 30px var(--green-glow), inset 0 -3px 0 rgba(0, 0, 0, .14), inset 0 2px 0 rgba(255, 255, 255, .28);
            animation: pulse 2.2s ease-out infinite;
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .cta:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 18px 38px var(--green-glow), inset 0 -3px 0 rgba(0, 0, 0, .14), inset 0 2px 0 rgba(255, 255, 255, .28)
        }

        .cta:active {
            transform: translateY(1px) scale(.99)
        }

        .cta .heart {
            width: 30px;
            height: 30px
        }

        .cta .go {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #fff;
            color: var(--green-dark);
            margin-left: 6px;
        }

        .cta .go svg {
            width: 24px;
            height: 24px
        }

        .cta-note {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 14px 0 0 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, .88)
        }

        .cta-note svg {
            width: 16px;
            height: 16px;
            color: #7fe3a8
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 12px 30px var(--green-glow), 0 0 0 0 rgba(24, 169, 87, .55), inset 0 -3px 0 rgba(0, 0, 0, .14), inset 0 2px 0 rgba(255, 255, 255, .28)
            }
            70%,
            100% {
                box-shadow: 0 12px 30px var(--green-glow), 0 0 0 22px rgba(24, 169, 87, 0), inset 0 -3px 0 rgba(0, 0, 0, .14), inset 0 2px 0 rgba(255, 255, 255, .28)
            }
        }

        @media (prefers-reduced-motion:reduce) {
            .cta {
                animation: none
            }
            html {
                scroll-behavior: auto
            }
        }

        /* ---------- Hero ---------- */

        .hero {
            position: relative;
            background: #0e0e10;
            color: #fff;
            overflow: hidden;
            min-height: 620px
        }

        .hero-photo {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 50%;
            background: #0e0e10;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(90deg, #0e0e10 0%, #0e0e10 40%, rgba(14, 14, 16, .78) 60%, rgba(14, 14, 16, 0) 85%)
        }

        .nav {
            position: relative;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 22px
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .brand svg {
            width: 44px;
            height: 44px
        }

        .brand b {
            display: block;
            font-size: 18px;
            letter-spacing: .04em;
            line-height: 1.1
        }

        .brand small {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--red);
            letter-spacing: .02em;
            text-transform: uppercase
        }

        .nav ul {
            display: flex;
            gap: 30px;
            list-style: none;
            margin: 0;
            padding: 0;
            font-size: 14px;
            font-weight: 500
        }

        .nav a {
            padding: 8px 0;
            border-bottom: 2px solid transparent;
            display: inline-block
        }

        .nav a.on {
            border-color: var(--red)
        }

        .hero-inner {
            position: relative;
            z-index: 3;
            padding: 62px 0 70px;
            max-width: 520px
        }

        .kicker {
            font-size: 14px;
            letter-spacing: .06em;
            text-transform: uppercase;
            margin: 0 0 14px;
            color: #e9e9ee
        }

        .hero h1 {
            margin: 0 0 20px;
            font-size: clamp(32px, 4.4vw, 42px);
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: -.01em
        }

        .hero h1 span {
            display: block;
            color: var(--red)
        }

        .hero p.lead {
            font-size: 16.5px;
            color: #f1f1f4;
            margin: 0 0 30px;
            max-width: 460px
        }

        .hand {
            position: absolute;
            z-index: 3;
            right: 42%;
            top: 34%;
            font-family: Caveat, "Segoe Script", cursive;
            font-size: 34px;
            line-height: 1.05;
            transform: rotate(-8deg);
            text-align: center;
            text-shadow: 0 2px 12px rgba(0, 0, 0, .6)
        }

        .hand svg {
            display: block;
            margin: 6px auto 0;
            width: 110px;
            height: 28px
        }

        .story {
            background: var(--bg);
            padding: 26px 0 36px
        }

        .story-grid {
            display: grid;
            grid-template-columns: 1fr 1.05fr .85fr;
            gap: 34px;
            align-items: center
        }
